# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: blogdown

permissions: read-all

jobs:
  blogdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
      
      - name: Install hugo
        run: blogdown::install_hugo(version = "0.170.1")
        shell: Rscript {0}

      # Hugo >= 0.170.0 dropped LibSass; Dart Sass is required for toCSS
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.108.2
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${RUNNER_TEMP}" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Build site
        run: |
          blogdown::build_site(TRUE)
          # blogdown does not fail on Hugo errors, so check the output exists
          if (!file.exists("public/index.html")) stop("Hugo build failed: public/index.html not found")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: success() && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
